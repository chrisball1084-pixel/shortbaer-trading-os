name: ShortBär Trading OS auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Qualität prüfen
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Statische PWA bauen
        env:
          NEXT_PUBLIC_BASE_PATH: /shortbaer-trading-os
        run: pnpm build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Ausgabe hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
